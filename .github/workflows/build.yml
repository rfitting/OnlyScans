# Builds OnlyScans.exe on a Windows machine at GitHub.
# - Every push to main and every pull request: builds and keeps the .exe as a downloadable artifact.
# - Publishing a release (Releases -> Draft a new release -> Publish): also attaches OnlyScans.exe to it.
# - Actions tab -> "Build OnlyScans.exe" -> "Run workflow": builds on demand.

name: Build OnlyScans.exe

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the app parses
        run: python -m py_compile onlyscans.py

      - name: Build the payload (Windows Python + pyserial + onlyscans.py)
        env:
          # releases get their tag (e.g. v1.2.0) stamped in, which drives the update check
          ONLYSCANS_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}
        run: python scripts/build_payload.py

      - name: Build the launcher (OnlyScans.exe)
        working-directory: launcher
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"   # no Visual C++ runtime needed on users' PCs
        run: |
          $env:ONLYSCANS_PAYLOAD = (Resolve-Path ..\build\payload.tar.gz).Path
          $env:ONLYSCANS_PAYLOAD_ID = (Get-Content ..\build\payload.id -Raw).Trim()
          cargo build --release --locked
          Copy-Item target\release\onlyscans.exe ..\OnlyScans.exe

      - name: Smoke test (the packaged app starts and lists serial ports)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          .\OnlyScans.exe --list-ports
          if ($LASTEXITCODE -ne 0) { throw "OnlyScans.exe --list-ports failed" }
          .\OnlyScans.exe --version

      - name: Build the test J2534 driver (32-bit)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: J2534 test (scan through a stand-in pass-thru driver)
        shell: pwsh
        run: |
          cl /nologo /LD /O2 tests\j2534_stub\stub.c /Fe:tests\j2534_stub\onlyscans_stub.dll /link /DEF:tests\j2534_stub\stub.def
          if ($LASTEXITCODE -ne 0) { throw "stub driver didn't compile" }
          $key = "HKLM:\SOFTWARE\WOW6432Node\PassThruSupport.04.04\OnlyScans Test Device"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name Name -Value "OnlyScans Test Device" -Force | Out-Null
          New-ItemProperty -Path $key -Name Vendor -Value "OnlyScans CI" -Force | Out-Null
          New-ItemProperty -Path $key -Name FunctionLibrary -Value (Resolve-Path tests\j2534_stub\onlyscans_stub.dll).Path -Force | Out-Null
          New-ItemProperty -Path $key -Name ISO15765 -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name CAN -Value 1 -PropertyType DWord -Force | Out-Null
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          .\OnlyScans.exe --list-ports
          .\OnlyScans.exe --port "j2534:OnlyScans Test Device" --make toyota --json j2534.json
          python -c "import json; r = json.load(open('j2534.json')); codes = [c['code'] for c in r['codes']]; print('VIN', r['vin'], 'codes', codes, 'adapter', r['adapter']); assert r['vin'] == 'JTMBF4DV1AD000000', r['notes']; assert 'P0301' in codes, r['notes']; print('J2534 path OK')"

      - name: Update test (an old build updates itself to a new one)
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          foreach ($v in "0.0.1", "0.0.2") {
            $env:ONLYSCANS_VERSION = $v
            python scripts/build_payload.py
            if ($LASTEXITCODE -ne 0) { throw "payload $v failed" }
            Push-Location launcher
            $env:ONLYSCANS_PAYLOAD = (Resolve-Path ..\build\payload.tar.gz).Path
            $env:ONLYSCANS_PAYLOAD_ID = (Get-Content ..\build\payload.id -Raw).Trim()
            cargo build --release --locked
            if ($LASTEXITCODE -ne 0) { throw "launcher $v failed" }
            Pop-Location
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\upd\$v" | Out-Null
            Copy-Item launcher\target\release\onlyscans.exe "$env:RUNNER_TEMP\upd\$v\OnlyScans.exe"
          }
          python tests/update_test.py "$env:RUNNER_TEMP\upd\0.0.1\OnlyScans.exe" "$env:RUNNER_TEMP\upd\0.0.2\OnlyScans.exe"
          if ($LASTEXITCODE -ne 0) { throw "update test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyScans
          path: OnlyScans.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: OnlyScans.exe
